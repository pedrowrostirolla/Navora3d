<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#141a2d" />
  <title>Navora 3D • Gestão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div id="toast-container" class="toast-container"></div>
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <img class="login-logo" src="assets/navora-logo.png" alt="Navora 3D" />
      <div class="login-brand">Navora <span>3D</span></div>
      <p class="login-subtitle">Gestão inteligente para sua operação.</p>
      <form id="login-form" class="form-stack">
        <label>Usuário<input id="login-user" autocomplete="username" required /></label>
        <label>Senha<input id="login-pass" type="password" autocomplete="current-password" required /></label>
        <button class="btn btn-primary btn-lg" type="submit">Entrar no sistema</button>
      </form>
      <div class="login-hint">Acesso administrativo</div>
    </div>
  </div>

  <div id="app-shell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="sidebar-brand"><img class="sidebar-logo" src="assets/navora-logo.png" alt="Navora 3D" /></div>
      <nav id="main-nav" class="main-nav">
        <button data-module="dashboard" class="nav-item active"><span>▦</span>Dashboard</button>
        <button data-module="cadastros" class="nav-item"><span>◫</span>Cadastros</button>
        <button data-module="catalogo" class="nav-item"><span>◈</span>Catálogo de Produtos</button>
        <button data-module="estoque" class="nav-item"><span>▤</span>Estoque</button>
        <button data-module="compras" class="nav-item"><span>▧</span>Compras</button>
        <button data-module="orcamentos" class="nav-item"><span>▰</span>Orçamentos</button>
        <button data-module="producao" class="nav-item"><span>⚙</span>Produção</button>
        <button data-module="vendas" class="nav-item"><span>↗</span>Vendas</button>
        <button data-module="financeiro" class="nav-item"><span>R$</span>Financeiro</button>
        <button data-module="configuracoes" class="nav-item"><span>⚑</span>Configurações</button>
      </nav>
      <div class="sidebar-footer"><button id="logout-btn" class="nav-item logout"><span>⇥</span>Sair</button></div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button id="mobile-menu" class="icon-btn mobile-only">☰</button>
        <div><div id="page-kicker" class="page-kicker">Visão geral</div><h1 id="page-title">Dashboard</h1></div>
        <div class="topbar-actions"><div class="date-badge" id="today-label"></div><div class="user-badge"><span class="user-avatar">A</span><span>Administrador</span></div></div>
      </header>
      <section id="module-root" class="module-root"></section>
    </main>
  </div>

  <div id="modal-root"></div>
  <script src="app.js"></script>
</body>
</html>
